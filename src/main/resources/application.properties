# Nombre de la aplicación.
# Este valor se utiliza para identificar el nombre de la aplicación en el contexto de Spring Boot.
spring.application.name=sistema-educativo-integral

# Configuración de la base de datos MySQL
# URL de conexión a la base de datos, incluyendo el nombre de la base de datos (sistema_educativo_integral).QL
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_educativo_integral

# Nombre de usuario para conectarse a la base de datos
spring.datasource.username=root

# Contraseña para conectarse a la base de datos.
spring.datasource.password=Lucho2025

# Clase del controlador JDBC de MySQL utilizada por Spring para establecer la conexión.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Configuración de JPA/Hibernate
## Instrucción para Hibernate que define cómo manejar los cambios en el esquema de la base de datos.
## "update" actualiza el esquema sin eliminar datos existentes.
spring.jpa.hibernate.ddl-auto=update
# Habilita la visualización de las consultas SQL ejecutadas por Hibernate en la consola.
spring.jpa.show-sql=true

# Formatea las consultas SQL mostradas en la consola para que sean más legibles.
spring.jpa.properties.hibernate.format_sql=true

# Define el dialecto de Hibernate para MySQL 8, optimizando las consultas según la base de datos utilizada.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
