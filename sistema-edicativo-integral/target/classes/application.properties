# Nombre de la aplicaci�n.
# Este valor se utiliza para identificar el nombre de la aplicaci�n en el contexto de Spring Boot.
spring.application.name=sistema-educativo-integral

# Configuraci�n de la base de datos MySQL
# URL de conexi�n a la base de datos, incluyendo el nombre de la base de datos (sistema_educativo_integral).QL
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_educativo_integral

# Nombre de usuario para conectarse a la base de datos
spring.datasource.username=root

# Contrase�a para conectarse a la base de datos.
spring.datasource.password=

# Clase del controlador JDBC de MySQL utilizada por Spring para establecer la conexi�n.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Configuraci�n de JPA/Hibernate
## Instrucci�n para Hibernate que define c�mo manejar los cambios en el esquema de la base de datos.
## "update" actualiza el esquema sin eliminar datos existentes.
spring.jpa.hibernate.ddl-auto=update
# Habilita la visualizaci�n de las consultas SQL ejecutadas por Hibernate en la consola.
spring.jpa.show-sql=true

# Formatea las consultas SQL mostradas en la consola para que sean m�s legibles.
spring.jpa.properties.hibernate.format_sql=true

# Define el dialecto de Hibernate para MySQL 8, optimizando las consultas seg�n la base de datos utilizada.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# CORS Global (Permitir solo desde React en desarrollo)
spring.mvc.cors.allowed-origins=http://localhost:3006
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE
spring.mvc.cors.allowed-headers=*

@SpringBootApplication
public class SistemaEducativoIntegralApplication {
public static void main(String[] args) {
SpringApplication.run(SistemaEducativoIntegralApplication.class, args);
}

@Bean
public WebMvcConfigurer corsConfigurer() {
return new WebMvcConfigurer() {
@Override
public void addCorsMappings(CorsRegistry registry) {
registry.addMapping("/api/**")
.allowedOrigins("http://localhost:3000") // URL de React
.allowedMethods("*");
}
};
}
}